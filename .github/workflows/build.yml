name: Build .ehpk

# main へのプッシュ、v から始まるタグ、プルリクエスト、手動実行でビルドする。
#  - どの場合も Actions の Artifacts に evenglish.ehpk を置く
#  - main へのプッシュ / 手動実行では、リリース「latest」を最新ビルドで作り直す
#  - タグ（v0.1.0 など）では、そのバージョンのリリースを作る
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 変更サマリを前回のビルドとの差分から作るので、履歴とタグをすべて取る
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check that the tag matches app.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_ver=$(node -p "require('./app.json').version")
          if [ "v$app_ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と app.json の version ($app_ver) が一致しません"
            exit 1
          fi

      # Even Hub は同じバージョンをアップロードすると前のビルドを差し替えるので、
      # タグ以外のビルドでは app.json の x.y.z の z を Actions の実行番号にして毎回上げる
      # （例: 0.1.0 → 0.1.42）。タグのビルドは app.json の version のまま
      - name: Set the build version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const [major, minor] = app.version.split(".");
            app.version = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log(`version: ${app.version}`);
          '

      # SDK のバージョンを明示して、実際に使っている SDK に合った min_app_version を付ける
      - name: Build and pack
        run: |
          npm run build
          sdk_ver=$(node -p "require('./node_modules/@evenrealities/even_hub_sdk/package.json').version")
          npx evenhub pack app.json dist -o evenglish.ehpk --sdk-ver "$sdk_ver"

      - uses: actions/upload-artifact@v4
        with:
          name: evenglish-ehpk
          path: evenglish.ehpk
          if-no-files-found: error

      - name: Update the "latest" release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_ver=$(node -p "require('./app.json').version")
          # 前回の latest（前回の main ビルド）からの変更を、Change log 欄に貼れる 500 文字以内でまとめる
          changelog=$(node scripts/changelog.mjs latest)
          notes="main の最新ビルドです（version: ${app_ver} / commit: ${GITHUB_SHA::7}）。
          evenglish.ehpk をダウンロードして、Even Hub の開発者サイトの Private builds にアップロードしてください。

          ### Change log（$(printf %s "$changelog" | node -p "require('fs').readFileSync(0, 'utf8').length") / 500 文字）

          \`\`\`text
          ${changelog}
          \`\`\`"
          # 差し替えだとリリースの日付が最初に作ったときのままになるので、毎回作り直す
          gh release delete latest --yes || true
          # タグ latest を今のコミットに付け直す
          git tag -f latest
          git push -f origin refs/tags/latest
          gh release create latest evenglish.ehpk --prerelease --verify-tag \
            --title "最新ビルド (main)" --notes "$notes"

      - name: Create a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ひとつ前のバージョンタグからの変更をまとめる
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          changelog=$(node scripts/changelog.mjs "$prev")
          notes="### Change log（$(printf %s "$changelog" | node -p "require('fs').readFileSync(0, 'utf8').length") / 500 文字）

          \`\`\`text
          ${changelog}
          \`\`\`"
          # --notes の内容は自動生成のリリースノートの前に入る
          gh release create "$GITHUB_REF_NAME" evenglish.ehpk \
            --title "EvEnglish $GITHUB_REF_NAME" --notes "$notes" --generate-notes
